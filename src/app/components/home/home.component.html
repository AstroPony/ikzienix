<section class="hero-gallery">
  <input type="radio" name="gallery" id="slide1" checked>
  <input type="radio" name="gallery" id="slide2">
  <input type="radio" name="gallery" id="slide3">
  <input type="radio" name="gallery" id="slide4">

  <div class="slides">
    <div class="slide slide1"></div>
    <div class="slide slide2"></div>
    <div class="slide slide3"></div>
    <div class="slide slide4"></div>
  </div>

  <!-- Centered Slogan and CTA -->
  <div class="banner-center-content">
    <h1 class="banner-slogan">See the Future. <span class="text-electric-purple">Wear the Future.</span></h1>
    <a routerLink="/products" class="cta-future banner-cta">get'em</a>
  </div>

  <div class="gallery-arrows">
    <button type="button" class="arrow arrow-left" aria-label="Previous slide" onclick="galleryPrev()">&#10094;</button>
    <button type="button" class="arrow arrow-right" aria-label="Next slide" onclick="galleryNext()">&#10095;</button>
  </div>
  <div class="gallery-dots">
    <label for="slide1" class="dot" aria-label="Go to slide 1"></label>
    <label for="slide2" class="dot" aria-label="Go to slide 2"></label>
    <label for="slide3" class="dot" aria-label="Go to slide 3"></label>
    <label for="slide4" class="dot" aria-label="Go to slide 4"></label>
  </div>
  <script>
    function galleryPrev() {
      const slides = [
        document.getElementById('slide1'),
        document.getElementById('slide2'),
        document.getElementById('slide3'),
        document.getElementById('slide4')
      ];
      let idx = slides.findIndex(r => r.checked);
      slides[(idx + 3) % 4].checked = true;
    }
    function galleryNext() {
      const slides = [
        document.getElementById('slide1'),
        document.getElementById('slide2'),
        document.getElementById('slide3'),
        document.getElementById('slide4')
      ];
      let idx = slides.findIndex(r => r.checked);
      slides[(idx + 1) % 4].checked = true;
    }
  </script>
</section>

<!-- Featured Products List will go here -->
<div class="featured-products-list-wrapper">
  <app-featured-products-list></app-featured-products-list>
</div>

<!-- Newsletter section will go here -->
<section class="newsletter-section">
  <form class="newsletter-form" (ngSubmit)="subscribe()" #newsletterForm="ngForm">
    <h2 class="newsletter-title font-orbitron text-cyber-yellow mb-2">Stay in the Loop</h2>
    <p class="newsletter-desc text-muted mb-3">Sign up for exclusive drops, futuristic deals, and more.</p>
    <div class="input-group mb-3">
      <input type="email" class="form-control newsletter-input" placeholder="Your email address" name="email" [(ngModel)]="newsletterEmail" required email>
      <button class="btn cta-future newsletter-btn" type="submit">Subscribe</button>
    </div>
    <div *ngIf="newsletterSuccess" class="alert alert-success mt-2 mb-0 py-2 px-3 rounded-pill text-center fade-in">
      Thanks for subscribing!
    </div>
  </form>
</section>
