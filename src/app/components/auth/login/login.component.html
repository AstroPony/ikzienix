<div class="container-fluid px-0 bg-midnight-black min-vh-100 bg-gradient-purple d-flex align-items-center justify-content-center">
  <div class="row w-100 justify-content-center">
    <div class="col-12 col-md-6 col-lg-5">
      <div class="card glassy-card shadow-electric-purple">
        <div class="card-header bg-dark text-cyber-yellow font-orbitron">
          <h3 class="mb-0 font-orbitron">Login</h3>
        </div>
        <div class="card-body">
          <form>
            <div class="mb-3">
              <label for="email" class="form-label font-space-grotesk text-cyber-yellow">Email</label>
              <input type="email" class="form-control bg-midnight-black text-cyber-yellow border-electric-purple" id="email" required>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label font-space-grotesk text-cyber-yellow">Password</label>
              <input type="password" class="form-control bg-midnight-black text-cyber-yellow border-electric-purple" id="password" required>
            </div>
            <button type="submit" class="btn cta-future w-100 min-h-48">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
